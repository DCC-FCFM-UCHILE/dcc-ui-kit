<!--
titulo: Checkbox y radio
grupo: Entradas
resumen: Controles de selección: marcar opciones independientes o elegir una entre varias.
miniatura: .dcc-control-grid
escala: .5
-->
<h2 class="dcc-doc-h2" id="ejemplos">Ejemplos</h2>
<div class="dcc-doc-demo">
  <div class="dcc-control-grid">
  
        <div class="dcc-control-col">
          <label class="dcc-control">
            <span>Checkbox Label</span>
            <input type="checkbox">
            <span class="dcc-box">
              <svg class="dcc-check dcc-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
            </span>
          </label>
          <label class="dcc-control">
            <span>Checkbox Label</span>
            <input type="checkbox" checked="">
            <span class="dcc-box">
              <svg class="dcc-check dcc-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
            </span>
          </label>
          <label class="dcc-control">
            <span>Checkbox Label</span>
            <input type="checkbox" class="js-indeterminate">
            <span class="dcc-box">
              <svg class="dcc-dash dcc-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"></path></svg>
            </span>
          </label>
        </div>
  
        <div class="dcc-control-col">
          <label class="dcc-control">
            <input type="radio" name="demo-radio">
            <span class="dcc-dot"></span>
            <span>Radio Label</span>
          </label>
          <label class="dcc-control">
            <input type="radio" name="demo-radio" checked="">
            <span class="dcc-dot"></span>
            <span>Radio Label</span>
          </label>
        </div>
  
        <div class="dcc-control-col">
          <label class="dcc-control">
            <span>Switch Label</span>
            <input type="checkbox" role="switch">
            <span class="dcc-track"></span>
          </label>
          <label class="dcc-control">
            <span>Switch Label</span>
            <input type="checkbox" role="switch" checked="">
            <span class="dcc-track"></span>
          </label>
        </div>
  
      </div>
</div>
