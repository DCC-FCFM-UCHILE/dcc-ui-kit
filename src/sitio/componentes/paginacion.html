<!--
titulo: Paginación
grupo: Navegación
resumen: Navega entre páginas de resultados.
miniatura: .dcc-pagination
escala: .8
-->
<h2 class="dcc-doc-h2" id="ejemplos">Ejemplos</h2>
<div class="dcc-doc-demo">
  <nav class="dcc-pagination js-pagination" aria-label="Paginación de resultados">
        <button class="dcc-pagination__btn" type="button" aria-label="Página anterior" disabled="">
          <svg class="dcc-i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-left"></use></svg>
        </button>
        <button class="dcc-pagination__btn" type="button" aria-current="page">1</button>
        <button class="dcc-pagination__btn" type="button">2</button>
        <button class="dcc-pagination__btn" type="button">3</button>
        <button class="dcc-pagination__btn" type="button">4</button>
        <button class="dcc-pagination__btn" type="button">5</button>
        <span class="dcc-pagination__gap" aria-hidden="true"><svg class="dcc-i" viewBox="0 0 24 24"><use href="#i-ellipsis"></use></svg></span>
        <button class="dcc-pagination__btn" type="button">10</button>
        <button class="dcc-pagination__btn" type="button" aria-label="Página siguiente">
          <svg class="dcc-i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-right"></use></svg>
        </button>
      </nav>
</div>
